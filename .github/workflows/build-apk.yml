name: Build AppWorld Final READY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Ritik-Final-READY.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: appworld-final-ready-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AppWorld-Ritik-Final-READY.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE must be in the repository root (main Code page)."
            exit 1
          }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE="$(find extracted -type f -name settings.gradle -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: app/build.gradle was not found beside settings.gradle."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Configure Supabase properties when secrets are available
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          PROPS="$PROJECT_DIR/gradle.properties"
          touch "$PROPS"
          # Remove placeholder or older values, then add the current GitHub secrets.
          sed -i '/^SUPABASE_URL=/d; /^SUPABASE_ANON_KEY=/d' "$PROPS"
          if [[ -n "${SUPABASE_URL:-}" && -n "${SUPABASE_ANON_KEY:-}" ]]; then
            case "$SUPABASE_URL" in
              https://*.supabase.co) ;;
              *) echo "ERROR: SUPABASE_URL must look like https://YOUR-PROJECT.supabase.co"; exit 1 ;;
            esac
            if [[ "$SUPABASE_ANON_KEY" == *"service_role"* || "$SUPABASE_ANON_KEY" == sb_secret_* ]]; then
              echo "ERROR: Use the Supabase anon/publishable key, never service_role or sb_secret."; exit 1
            fi
            {
              printf '\nSUPABASE_URL=%s\n' "$SUPABASE_URL"
              printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            } >> "$PROPS"
            echo "Supabase secrets configured."
          else
            echo "WARNING: Supabase secrets are not both set. APK will build with ZIP defaults; online Supabase features may not connect."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify and stage APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || {
            echo "ERROR: app-debug.apk was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          }
          mkdir -p artifacts
          cp "$APK" artifacts/AppWorld-Final-READY-debug.apk
          ls -lh artifacts/AppWorld-Final-READY-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Final-READY-debug-apk
          path: artifacts/AppWorld-Final-READY-debug.apk
          if-no-files-found: error
          retention-days: 14
