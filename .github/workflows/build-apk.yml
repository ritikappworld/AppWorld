name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld 2.0.3 Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract AppWorld 2.0.3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AppWorld-2.0.3-Java-Auth-UI-GitHub-Ready.zip"
          EXTRACT_DIR="$RUNNER_TEMP/appworld-2.0.3-source"
          PROJECT_DIR="$EXTRACT_DIR/AppWorld-Android-Java"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Required ZIP not found: $ZIP_FILE"
            echo "Upload this exact ZIP to the repository root."
            ls -lah
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Expected Android project files were not found inside the ZIP."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "APPWORLD_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified project at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found: $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_SDK_MANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_MANAGER" --sdk_root="$ANDROID_HOME"             "platform-tools"             "platforms;android-34"             "build-tools;34.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0.3 Debug APK
        working-directory: ${{ env.APPWORLD_PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$APPWORLD_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated: $APK_PATH"
            find "$APPWORLD_PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload AppWorld 2.0.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: ${{ env.APPWORLD_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
