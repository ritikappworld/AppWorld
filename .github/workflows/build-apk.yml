name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          if [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "AppWorld-Android-Java/app/build.gradle" ]; then
            PROJECT_DIR="AppWorld-Android-Java"
          else
            echo "::error::app/build.gradle not found. Upload the AppWorld-Android-Java project folder to the repository."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "apk_path=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          EXTRA_ARGS=()

          if [ -n "$SUPABASE_URL" ]; then
            EXTRA_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi

          if [ -n "$SUPABASE_ANON_KEY" ]; then
            EXTRA_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi

          gradle --no-daemon --stacktrace assembleDebug "${EXTRA_ARGS[@]}"

      - name: Verify APK
        env:
          APK_PATH: ${{ steps.project.outputs.apk_path }}
        shell: bash
        run: |
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated at $APK_PATH"
            exit 1
          fi
          echo "APK generated successfully: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-debug-apk
          path: ${{ steps.project.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
