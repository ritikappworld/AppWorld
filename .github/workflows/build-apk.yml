
name: AppWorld 2.0.3 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or Extract AppWorld Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          # First: find an already extracted Android project
          while IFS= read -r file; do
            DIR="$(dirname "$file")"
            if [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print)

          # Second: extract a ZIP if no project folder was found
          if [ -z "$PROJECT" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' \
              | head -n 1 || true)"

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p "$RUNNER_TEMP/appworld-extracted"
              unzip -q "$ZIP_FILE" \
                -d "$RUNNER_TEMP/appworld-extracted"

              while IFS= read -r file; do
                DIR="$(dirname "$file")"
                if [ -f "$DIR/app/build.gradle" ]; then
                  PROJECT="$DIR"
                  break
                fi
              done < <(find "$RUNNER_TEMP/appworld-extracted" \
                -name settings.gradle -print)
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: AppWorld Gradle project not found."
            echo "Expected settings.gradle and app/build.gradle."
            exit 1
          fi

          echo "Project found: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME" \
            -name sdkmanager -type f | head -n 1)"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          echo "Java version:"
          java -version
          echo "Gradle version:"
          gradle --version
          echo "Android SDK: $ANDROID_HOME"

      - name: Build Debug APK
        id: build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon \
            --stacktrace \
            --info \
            assembleDebug 2>&1 | tee "$RUNNER_TEMP/appworld-build.log"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-Debug-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-Build-Logs
          path: ${{ runner.temp }}/appworld-build.log
          if-no-files-found: ignore
          retention-days: 7
