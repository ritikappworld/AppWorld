
name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld 2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Extract AppWorld ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="AppWorld-2.0-Java-Updated.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: AppWorld 2.0 ZIP missing"
            ls -la
            exit 1
          fi

          mkdir -p _appworld_build
          unzip -q "$ZIP" -d _appworld_build

          SETTINGS=$(find _appworld_build -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ARGS=()

          if [ -n "${SUPABASE_URL:-}" ]; then
            ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi

          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi

          gradle --no-daemon assembleDebug "${ARGS[@]}"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/apk-output/AppWorld-2.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-APK
          path: apk-output/AppWorld-2.0.apk
          if-no-files-found: error
          retention-days: 14
