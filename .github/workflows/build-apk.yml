name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: appworld-2-0-3-${{ github.ref }}
  cancel-in-progress: true

env:
  APPWORLD_ZIP_NAME: AppWorld-2.0.3-Java-Auth-UI-GitHub-Ready-YML-Fixed-3.zip
  APPWORLD_PROJECT_DIR: AppWorld-Android-Java
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract AppWorld source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${APPWORLD_PROJECT_DIR}/settings.gradle" ]]; then
            echo "Using extracted project directory: ${APPWORLD_PROJECT_DIR}"
          elif [[ -f "${APPWORLD_ZIP_NAME}" ]]; then
            echo "Extracting source archive: ${APPWORLD_ZIP_NAME}"
            unzip -q "${APPWORLD_ZIP_NAME}" -d .
          else
            echo "ERROR: Neither ${APPWORLD_PROJECT_DIR}/settings.gradle nor ${APPWORLD_ZIP_NAME} was found."
            echo "Upload the ZIP to the repository root, or extract its contents into the repository root."
            exit 1
          fi
          test -f "${APPWORLD_PROJECT_DIR}/settings.gradle" || { echo "ERROR: settings.gradle missing."; exit 1; }
          test -f "${APPWORLD_PROJECT_DIR}/build.gradle" || { echo "ERROR: root build.gradle missing."; exit 1; }
          test -f "${APPWORLD_PROJECT_DIR}/app/build.gradle" || { echo "ERROR: app/build.gradle missing."; exit 1; }
          test -f "${APPWORLD_PROJECT_DIR}/app/src/main/AndroidManifest.xml" || { echo "ERROR: AndroidManifest.xml missing."; exit 1; }
          grep -q "versionName '2.0.3'" "${APPWORLD_PROJECT_DIR}/app/build.gradle" || { echo "ERROR: Expected AppWorld version 2.0.3."; exit 1; }
          echo "AppWorld 2.0.3 project structure verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build AppWorld 2.0.3 debug APK
        working-directory: ${{ env.APPWORLD_PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ARGS=(--no-daemon --stacktrace)
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=${SUPABASE_URL}")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}")
          fi
          gradle "${GRADLE_ARGS[@]}" clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="${APPWORLD_PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}" || { echo "ERROR: APK missing or empty: ${APK}"; exit 1; }
          echo "APK generated successfully:"
          ls -lh "${APK}"

      - name: Upload AppWorld 2.0.3 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
