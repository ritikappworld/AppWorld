name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Ritik-Final-READY.zip'
      - '.github/workflows/build-appworld.yml'

permissions:
  contents: read

concurrency:
  group: appworld-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files and Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -f "AppWorld-Ritik-Final-READY.zip" || {
            echo "ERROR: AppWorld-Ritik-Final-READY.zip was not found in the repository root."
            exit 1
          }
          test -n "${SUPABASE_URL}" || {
            echo "ERROR: Add the GitHub Actions secret SUPABASE_URL."
            exit 1
          }
          test -n "${SUPABASE_ANON_KEY}" || {
            echo "ERROR: Add the GitHub Actions secret SUPABASE_ANON_KEY."
            exit 1
          }
          case "${SUPABASE_URL}" in
            https://*.supabase.co) ;;
            *) echo "ERROR: SUPABASE_URL must look like https://YOUR-PROJECT.supabase.co"; exit 1 ;;
          esac
          if [[ "${SUPABASE_ANON_KEY}" == *"service_role"* ]]; then
            echo "ERROR: Do not put a service_role key in an Android app. Use the anon/publishable key."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AppWorld project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "AppWorld-Ritik-Final-READY.zip" -d project
          PROJECT_DIR="$(find project -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [[ -z "${PROJECT_DIR}" || ! -f "${PROJECT_DIR}/app/build.gradle" ]]; then
            echo "ERROR: ZIP must contain a project folder with settings.gradle and app/build.gradle."
            exit 1
          fi
          echo "APPWORLD_PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Project found at: ${PROJECT_DIR}"

      - name: Configure Supabase for this build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            printf '\n# Values supplied securely by GitHub Actions\n'
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } >> "${APPWORLD_PROJECT_DIR}/gradle.properties"

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "${APPWORLD_PROJECT_DIR}"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK was generated
        run: |
          set -euo pipefail
          APK_PATH="${APPWORLD_PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH" || {
            echo "ERROR: Build completed but app-debug.apk was not found."
            find "${APPWORLD_PROJECT_DIR}/app/build/outputs" -maxdepth 5 -type f -print || true
            exit 1
          }
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/AppWorld-debug.apk
          ls -lh artifacts/AppWorld-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-APK
          path: artifacts/AppWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
          
