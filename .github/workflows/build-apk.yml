name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

permissions:
  contents: read

concurrency:
  group: appworld-2-0-3-${{ github.ref }}
  cancel-in-progress: true

env:
  APPWORLD_ZIP_NAME: AppWorld-2.0.3-Java-Auth-UI-GitHub-Ready.zip
  APPWORLD_PROJECT_DIR: AppWorld-Android-Java
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AppWorld 2.0.3 project from source ZIP
        shell: bash
        run: |
          echo "Expected source archive: ${APPWORLD_ZIP_NAME}"
          PROJECT="${APPWORLD_PROJECT_DIR}"
          test -f "${PROJECT}/settings.gradle" || { echo 'ERROR: settings.gradle missing. Extract the ZIP contents into the GitHub repository root.'; exit 1; }
          test -f "${PROJECT}/build.gradle" || { echo 'ERROR: root build.gradle missing.'; exit 1; }
          test -f "${PROJECT}/app/build.gradle" || { echo 'ERROR: app/build.gradle missing.'; exit 1; }
          test -f "${PROJECT}/app/src/main/AndroidManifest.xml" || { echo 'ERROR: AndroidManifest.xml missing.'; exit 1; }
          test -f ".github/workflows/build-apk.yml" || { echo 'ERROR: workflow must be saved at .github/workflows/build-apk.yml'; exit 1; }
          grep -q "versionName '2.0.3'" "${PROJECT}/app/build.gradle" || { echo 'ERROR: This is not the expected AppWorld 2.0.3 Gradle configuration.'; exit 1; }
          echo 'AppWorld 2.0.3 project structure verified.'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build AppWorld 2.0.3 debug APK
        working-directory: ${{ env.APPWORLD_PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          GRADLE_ARGS=(--no-daemon --stacktrace)
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=${SUPABASE_URL}")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}")
          fi
          gradle "${GRADLE_ARGS[@]}" clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          APK="${APPWORLD_PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "${APK}" ]]; then
            echo "ERROR: APK missing or empty: ${APK}"
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh "${APK}"

      - name: Upload AppWorld 2.0.3 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
