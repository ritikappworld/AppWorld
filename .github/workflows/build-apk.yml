
name: AppWorld 2.0 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld 2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="AppWorld-2.0-Java-Updated.zip"

          if [ ! -f "$ZIP" ]; then
            echo "AppWorld ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p appworld_build
          unzip -q "$ZIP" -d appworld_build

          SETTINGS=$(find appworld_build -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
