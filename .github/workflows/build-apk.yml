name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract AppWorld project
        run: |
          mkdir project
          unzip -q AppWorld-MobileStudio-FIXED.zip -d project

      - name: Configure Supabase
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("gradle.properties")
          text = p.read_text()

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          text = re.sub(r'(?m)^SUPABASE_URL=.*$', '', text)
          text = re.sub(r'(?m)^SUPABASE_ANON_KEY=.*$', '', text)

          text = text.rstrip() + "\n"
          text += "SUPABASE_URL=" + url + "\n"
          text += "SUPABASE_ANON_KEY=" + key + "\n"

          p.write_text(text)

          print("Supabase properties configured successfully.")
          PY
      - name: Fix Supabase BuildConfig
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import json

          path = Path("app/build.gradle")
          text = path.read_text()

          # Remove ALL existing Supabase BuildConfig lines
          text = re.sub(
              r'(?m)^[ \t]*buildConfigField\s+"String",\s+"SUPABASE_URL".*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*buildConfigField\s+"String",\s+"SUPABASE_ANON_KEY".*\n?',
              '',
              text
          )

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          url_groovy = json.dumps(url)
          key_groovy = json.dumps(key)

          fields = (
              '        buildConfigField "String", "SUPABASE_URL", '
              + url_groovy + '\n'
              '        buildConfigField "String", "SUPABASE_ANON_KEY", '
              + key_groovy
          )

          marker = "    defaultConfig {"

          if marker not in text:
              raise Exception("defaultConfig not found")

          text = text.replace(
              marker,
              marker + "\n" + fields,
              1
          )

          path.write_text(text)

          print("Supabase BuildConfig fixed.")
          PY
      - name: Build Debug APK
        working-directory: project/AppWorld-Android-Java
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Supabase-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
