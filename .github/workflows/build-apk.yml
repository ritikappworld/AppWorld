name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AppWorld project
        run: |
          mkdir project
          unzip -q AppWorld-MobileStudio-FIXED.zip -d project

          - name: Fix Supabase BuildConfig
        working-directory: project/AppWorld-Android-Java
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          lines = s.splitlines()
          new_lines = []

          for line in lines:
              if "SUPABASE_URL" not in line and "SUPABASE_ANON_KEY" not in line:
                  new_lines.append(line)

          s = "\n".join(new_lines)

          marker = '        buildConfigField "String", "SUPABASE_URL"'
          insert = '''        buildConfigField "String", "SUPABASE_URL", "\\"https://your-project-ref.supabase.co\\""
          buildConfigField "String", "SUPABASE_ANON_KEY", "\\"YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY\\""'''

          s = s.replace(
              '    defaultConfig {',
              '    defaultConfig {\n' + insert,
              1
          )

          p.write_text(s)
          print("Supabase BuildConfig fixed successfully.")
          PY
          
      - name: Build Debug APK
        working-directory: project/AppWorld-Android-Java
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-debug-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
