
name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Extract AppWorld
        shell: bash
        run: |
          set -e

          PROJECT=""

          # Search already extracted Android project
          PROJECT=$(find . -type f -name settings.gradle \
            -not -path './.gradle/*' \
            -print -quit | xargs -r dirname)

          # If project is not extracted, find ZIP anywhere
          if [ -z "$PROJECT" ]; then
            ZIP=$(find . -type f \
              -iname '*AppWorld*2.0.3*.zip' \
              -print -quit)

            if [ -z "$ZIP" ]; then
              echo "ERROR: AppWorld ZIP not found!"
              find . -maxdepth 5 -type f
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted

            PROJECT=$(find extracted -type f \
              -name settings.gradle \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle missing!"
            exit 1
          fi

          mkdir -p AppWorld-Android-Java
          cp -a "$PROJECT"/. AppWorld-Android-Java/

          echo "AppWorld project detected successfully!"
          ls -la AppWorld-Android-Java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld APK
        working-directory: AppWorld-Android-Java
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
