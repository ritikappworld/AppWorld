
name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: appworld-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppWorld Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Extract AppWorld
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          PROJECT=$(find . -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            ZIP=$(find . -type f \
              -iname '*AppWorld*2.0.3*.zip' \
              -print -quit)

            if [ -z "$ZIP" ]; then
              echo "ERROR: AppWorld ZIP not found"
              find . -maxdepth 4 -type f
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted

            PROJECT=$(find extracted -type f \
              -name settings.gradle \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle"

          mkdir -p AppWorld-Android-Java
          cp -a "$PROJECT"/. AppWorld-Android-Java/

          echo "AppWorld source detected successfully"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld Debug APK
        working-directory: AppWorld-Android-Java
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "APK missing or empty"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload AppWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
