
name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: appworld-203-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppWorld Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Extract AppWorld
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          find_project() {
            while IFS= read -r file; do
              dir="$(dirname "$file")"
              if [ -f "$dir/app/build.gradle" ] &&
                 [ -f "$dir/app/src/main/AndroidManifest.xml" ]; then
                echo "$dir"
                return 0
              fi
            done < <(find "$1" -type f \
              -name settings.gradle \
              -not -path '*/.git/*')
            return 1
          }

          PROJECT="$(find_project . || true)"

          if [ -z "$PROJECT" ]; then
            ZIP="$(find . -type f \
              -iname '*AppWorld*2.0.3*.zip' \
              -not -path './source/*' \
              -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "ERROR: AppWorld ZIP not found"
              exit 1
            fi

            mkdir -p source
            unzip -oq "$ZIP" -d source

            PROJECT="$(find_project source || true)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Valid Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SDK Manager..."
          command -v sdkmanager

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0"

          echo "Android SDK installation complete"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Build Environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version
          echo "Project directory verified"

      - name: Build AppWorld 2.0.3 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          echo "APK generated successfully"
          ls -lh "$APK"

      - name: Upload AppWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
