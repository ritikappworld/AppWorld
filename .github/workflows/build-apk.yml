name: Build AppWorld 1.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'AppWorld-Update-1.3.0-Java.zip'
      - '.github/workflows/build-appworld-1.3.0.yml'

permissions:
  contents: read

concurrency:
  group: appworld-1-3-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract AppWorld 1.3.0 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AppWorld-Update-1.3.0-Java.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Upload the ZIP to the top level of the GitHub repository."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/appworld-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/appworld-project"
          PROJECT_DIR="$RUNNER_TEMP/appworld-project/AppWorld-Android-Java"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" || ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: ZIP does not contain the expected AppWorld-Android-Java Gradle project."
            find "$RUNNER_TEMP/appworld-project" -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          GRADLE_ARGS=(--no-daemon --stacktrace)
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          gradle "${GRADLE_ARGS[@]}" clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/AppWorld-1.3.0-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-output/AppWorld-1.3.0-debug.apk"

      - name: Upload AppWorld 1.3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-1.3.0-debug-APK
          path: apk-output/AppWorld-1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 14
