name: Build AppWorld Update 1.2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Update-1.2.1-Java-Improved.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: appworld-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check ZIP and extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AppWorld-Update-1.2.1-Java-Improved.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Upload the ZIP to the repository root with this exact filename."
            exit 1
          fi
          unzip -t "$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR="project/AppWorld-Android-Java"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] || [ ! -f "$PROJECT_DIR/build.gradle" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Expected Android Gradle project was not found at $PROJECT_DIR."
            echo "Check that the ZIP contains the AppWorld-Android-Java folder at its top level."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          GRADLE_ARGS=(--no-daemon --stacktrace --warning-mode all)
          if [ -n "${SUPABASE_URL:-}" ]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=${SUPABASE_URL}")
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}")
          fi
          gradle "${GRADLE_ARGS[@]}" :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload AppWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Update-1.2.1-debug-apk
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
