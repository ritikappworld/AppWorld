
name: Build AppWorld 2.0.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld 2.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract AppWorld ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="AppWorld-2.0.2-Java-UI-Updated-GitHub-Ready.zip"
          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_NAME"
          EXTRACT_DIR="$RUNNER_TEMP/AppWorld-2.0.2"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP not found: $ZIP_NAME"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found"
            find "$EXTRACT_DIR" -maxdepth 6 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: 'yes'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set Up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload AppWorld 2.0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.2-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
