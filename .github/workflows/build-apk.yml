
name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager)"

          LICENSE_ANSWERS="$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses <<< "$LICENSE_ANSWERS"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract AppWorld 2.0 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AppWorld-2.0-Java-Updated.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: AppWorld 2.0 ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p _appworld_build
          unzip -q "$ZIP_FILE" -d _appworld_build

          PROJECT="_appworld_build/AppWorld-Android-Java"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "AppWorld 2.0 extracted successfully"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0 APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT"

          EXTRA_ARGS=()

          if [ -n "${SUPABASE_URL:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi

          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi

          gradle --no-daemon assembleDebug "${EXTRA_ARGS[@]}"

      - name: Upload AppWorld 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-debug-apk
          path: _appworld_build/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
