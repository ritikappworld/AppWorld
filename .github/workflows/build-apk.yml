name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'AppWorld-Android-Java/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found in the installed Android SDK." >&2
            exit 1
          fi

          # Feed license answers through a here-string, not `yes | sdkmanager`.
          # This avoids the Broken pipe failure seen in the previous workflow.
          LICENSE_ANSWERS="$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses <<< "$LICENSE_ANSWERS"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0 debug APK
        working-directory: AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${SUPABASE_URL:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          gradle --no-daemon assembleDebug "${EXTRA_ARGS[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
