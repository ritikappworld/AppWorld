name: Build AppWorld 1.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AppWorld ZIP
        run: |
          unzip -q AppWorld-Update-1.3.0-Java.zip -d project
          test -f project/AppWorld-Android-Java/settings.gradle

      - name: Build APK
        run: |
          cd project/AppWorld-Android-Java
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-1.3.0-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
