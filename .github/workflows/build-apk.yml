
name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: appworld-203-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppWorld Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Extract AppWorld
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          PROJECT=$(find . -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            ZIP=$(find . -type f \
              -iname '*AppWorld*2.0.3*.zip' \
              -print -quit)

            if [ -z "$ZIP" ]; then
              echo "ERROR: AppWorld ZIP not found"
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted

            PROJECT=$(find extracted -type f \
              -name settings.gradle \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle"

          mkdir -p AppWorld-Android-Java
          cp -a "$PROJECT"/. AppWorld-Android-Java/

          echo "AppWorld project detected successfully"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Install SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not found"
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld APK
        working-directory: AppWorld-Android-Java
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

      - name: Upload AppWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
