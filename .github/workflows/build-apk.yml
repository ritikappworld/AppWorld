name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract AppWorld project
        run: |
          mkdir project
          unzip -q AppWorld-MobileStudio-FIXED.zip -d project

      - name: Connect Supabase
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import json
          import re

          path = Path("app/build.gradle")
          text = path.read_text()

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          # Remove every old Supabase BuildConfig entry
          text = re.sub(
              r'(?m)^[ \t]*buildConfigField\s+"String",\s+"SUPABASE_URL".*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*buildConfigField\s+"String",\s+"SUPABASE_ANON_KEY".*\n?',
              '',
              text
          )

          # Create the correct BuildConfig entries
          supabase_lines = (
              '        buildConfigField "String", "SUPABASE_URL", '
              + json.dumps(url) + '\n'
              '        buildConfigField "String", "SUPABASE_ANON_KEY", '
              + json.dumps(key)
          )

          # Insert them only inside defaultConfig
          marker = "    defaultConfig {"

          if marker not in text:
              raise RuntimeError("defaultConfig block not found")

          text = text.replace(
              marker,
              marker + "\n" + supabase_lines,
              1
          )

          path.write_text(text)

          print("Supabase configuration completed successfully.")
          PY

      - name: Build Debug APK
        working-directory: project/AppWorld-Android-Java
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Supabase-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
