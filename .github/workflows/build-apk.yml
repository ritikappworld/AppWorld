name: Build AppWorld 1.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'AppWorld-Update-1.3.0-Java-FIXED.zip'
      - '.github/workflows/build-appworld-1.3.0.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile AppWorld 1.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AppWorld-Update-1.3.0-Java-FIXED.zip"
          test -f "$ZIP_FILE" || { echo "::error::Missing $ZIP_FILE in repository root"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR="project/AppWorld-Android-Java"
          test -f "$PROJECT_DIR/settings.gradle" || { echo "::error::settings.gradle not found"; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::app/build.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          BUILD_ARGS=(--no-daemon --stacktrace clean assembleDebug)
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            BUILD_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            BUILD_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          gradle "${BUILD_ARGS[@]}"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::Debug APK was not generated"; exit 1; }
          mkdir -p apk-output
          cp "$APK" apk-output/AppWorld-1.3.0-debug.apk
          ls -lh apk-output/AppWorld-1.3.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-1.3.0-debug-APK
          path: apk-output/AppWorld-1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 14
          
