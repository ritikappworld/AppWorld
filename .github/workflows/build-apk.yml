name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Ritik-Final.zip'
      - '.github/workflows/build-appworld.yml'

permissions:
  contents: read

concurrency:
  group: appworld-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract and verify AppWorld project
        shell: bash
        run: |
          set -euo pipefail
          test -f AppWorld-Ritik-Final.zip || {
            echo "ERROR: AppWorld-Ritik-Final.zip is missing from the repository root."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/appworld-project"
          unzip -q AppWorld-Ritik-Final.zip -d "$RUNNER_TEMP/appworld-project"
          PROJECT_DIR="$RUNNER_TEMP/appworld-project/AppWorld-Android-Java"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -n "${SUPABASE_URL:-}" ]; then
            export ORG_GRADLE_PROJECT_SUPABASE_URL="$SUPABASE_URL"
          else
            echo "WARNING: SUPABASE_URL secret is not set."
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            export ORG_GRADLE_PROJECT_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          else
            echo "WARNING: SUPABASE_ANON_KEY secret is not set."
          fi
          gradle --no-daemon clean :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-debug-apk
          path: ${{ runner.temp }}/appworld-project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
