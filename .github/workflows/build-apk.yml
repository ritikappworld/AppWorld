
name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(command -v sdkmanager)"

          LICENSE_ANSWERS="$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses <<< "$LICENSE_ANSWERS"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app module not found in $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0 APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"

          EXTRA_ARGS=()
          if [ -n "${SUPABASE_URL:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi

          gradle --no-daemon assembleDebug "${EXTRA_ARGS[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
