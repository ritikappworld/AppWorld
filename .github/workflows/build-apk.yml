name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld 2.0.3 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract AppWorld 2.0.3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AppWorld-2.0.3-Java-Auth-UI-GitHub-Ready.zip"
          EXTRACT_DIR="$RUNNER_TEMP/appworld-2.0.3-source"
          PROJECT_DIR="$EXTRACT_DIR/AppWorld-Android-Java"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Required ZIP not found at repository root: $ZIP_FILE"
            echo "Upload the exact AppWorld 2.0.3 ZIP to the repository root."
            echo "Repository root files:"
            ls -la
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The ZIP was extracted, but the expected Android project files were not found."
            echo "Expected: AppWorld-Android-Java/settings.gradle"
            echo "Expected: AppWorld-Android-Java/app/build.gradle"
            find "$EXTRACT_DIR" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "APPWORLD_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0.3 Debug APK
        working-directory: ${{ env.APPWORLD_PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$APPWORLD_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated at the expected path: $APK_PATH"
            find "$APPWORLD_PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload AppWorld 2.0.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: ${{ env.APPWORLD_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
