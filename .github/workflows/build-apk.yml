name: Build AppWorld 2.0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: appworld-2-0-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AppWorld 2.0.3 project files
        shell: bash
        run: |
          PROJECT_DIR="AppWorld-Android-Java"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" || ! -f "$PROJECT_DIR/build.gradle" || ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Expected AppWorld project was not found at $PROJECT_DIR."
            echo "Upload the extracted contents of AppWorld-2.0.3-Java-GitHub-Ready.zip to the repository root."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi
          echo "Project structure verified: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0.3 Debug APK
        working-directory: AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          GRADLE_ARGS=()
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=${SUPABASE_URL}")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}")
          fi
          gradle --no-daemon --stacktrace clean assembleDebug "${GRADLE_ARGS[@]}"

      - name: Verify generated APK
        shell: bash
        run: |
          APK_PATH="AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "ERROR: APK missing or empty: $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload AppWorld 2.0.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.3-debug-apk
          path: AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
