      - name: Fix Supabase BuildConfig
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          def escape(v):
              return v.replace("\\", "\\\\").replace('"', '\\"')

          url = escape(url)
          key = escape(key)

          # Remove ALL existing Supabase BuildConfig lines
          s = re.sub(
              r'(?m)^[ \t]*buildConfigField[^\n]*SUPABASE_URL[^\n]*\n?',
              '',
              s
          )

          s = re.sub(
              r'(?m)^[ \t]*buildConfigField[^\n]*SUPABASE_ANON_KEY[^\n]*\n?',
              '',
              s
          )

          # Add exactly one correct pair inside defaultConfig
          fields = (
              '        buildConfigField "String", "SUPABASE_URL", "\\"'
              + url +
              '\\""\n'
              '        buildConfigField "String", "SUPABASE_ANON_KEY", "\\"'
              + key +
              '\\""'
          )

          if "    defaultConfig {" not in s:
              raise Exception("defaultConfig not found")

          s = s.replace(
              "    defaultConfig {",
              "    defaultConfig {\n" + fields,
              1
          )

          p.write_text(s)

          print("Supabase BuildConfig configured correctly.")
          PY
