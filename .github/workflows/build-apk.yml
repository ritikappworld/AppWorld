name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Ritik-Final.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check and extract AppWorld project
        shell: bash
        run: |
          set -euo pipefail
          test -f AppWorld-Ritik-Final.zip || { echo 'AppWorld-Ritik-Final.zip was not found in the repository root.'; exit 1; }
          unzip -t AppWorld-Ritik-Final.zip
          mkdir -p project
          unzip -q AppWorld-Ritik-Final.zip -d project
          test -f project/AppWorld-Android-Java/settings.gradle || { echo 'Expected project/AppWorld-Android-Java/settings.gradle was not found. Check ZIP folder structure.'; find project -maxdepth 3 -type f | head -80; exit 1; }
          test -f project/AppWorld-Android-Java/app/build.gradle

      - name: Configure Supabase properties
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo 'Missing GitHub Actions secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY.'
            exit 1
          fi
          printf '\nSUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" >> gradle.properties

      - name: Build Debug APK
        working-directory: project/AppWorld-Android-Java
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Debug-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
