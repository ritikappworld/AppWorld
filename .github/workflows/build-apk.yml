name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0 debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$SUPABASE_URL" ]; then
            EXTRA_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            EXTRA_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          gradle --no-daemon assembleDebug "${EXTRA_ARGS[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
