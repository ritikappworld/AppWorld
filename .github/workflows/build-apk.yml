
name: Build AppWorld 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
            do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi

          LICENSE_ANSWERS="$(printf 'y\n%.0s' {1..100})"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            --licenses <<< "$LICENSE_ANSWERS"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App module not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld 2.0 APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()

          if [ -n "${SUPABASE_URL:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi

          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            EXTRA_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi

          gradle --no-daemon assembleDebug "${EXTRA_ARGS[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
