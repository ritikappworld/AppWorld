name: Build AppWorld 1.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/gradle.properties'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer an already-extracted project in the repository.
          if [[ -f "settings.gradle" && -f "app/build.gradle" ]]; then
            PROJECT_DIR="$PWD"
          elif [[ -f "AppWorld-Android-Java/settings.gradle" && -f "AppWorld-Android-Java/app/build.gradle" ]]; then
            PROJECT_DIR="$PWD/AppWorld-Android-Java"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -name 'AppWorld-Update-1.3.0-Java.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)"
            fi
            if [[ -z "$ZIP_FILE" ]]; then
              echo "Android project not found. Upload the extracted project files or AppWorld-Update-1.3.0-Java.zip."
              exit 1
            fi

            mkdir -p .appworld-extracted
            unzip -q "$ZIP_FILE" -d .appworld-extracted

            if [[ -f ".appworld-extracted/settings.gradle" && -f ".appworld-extracted/app/build.gradle" ]]; then
              PROJECT_DIR="$PWD/.appworld-extracted"
            elif [[ -f ".appworld-extracted/AppWorld-Android-Java/settings.gradle" && -f ".appworld-extracted/AppWorld-Android-Java/app/build.gradle" ]]; then
              PROJECT_DIR="$PWD/.appworld-extracted/AppWorld-Android-Java"
            else
              echo "ZIP extracted, but settings.gradle and app/build.gradle were not found at the expected project paths."
              find .appworld-extracted -maxdepth 4 -type f | head -80
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "Missing GitHub Actions secrets. Add SUPABASE_URL and SUPABASE_ANON_KEY in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          gradle --no-daemon --stacktrace \
            -PSUPABASE_URL="${SUPABASE_URL}" \
            -PSUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-1.3.0-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
