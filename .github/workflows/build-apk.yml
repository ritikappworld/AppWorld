name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AppWorld project
        run: |
          mkdir project
          unzip -q AppWorld-MobileStudio-FIXED.zip -d project

      - name: Connect Supabase
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import json

          path = Path("app/build.gradle")
          lines = path.read_text().splitlines()

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          cleaned = []

          for line in lines:
              if 'buildConfigField "String", "SUPABASE_URL"' in line:
                  continue
              if 'buildConfigField "String", "SUPABASE_ANON_KEY"' in line:
                  continue
              cleaned.append(line)

          insert_lines = [
              '        buildConfigField "String", "SUPABASE_URL", ' + json.dumps(url),
              '        buildConfigField "String", "SUPABASE_ANON_KEY", ' + json.dumps(key)
          ]

          inserted = False
          result = []

          for line in cleaned:
              result.append(line)

              if line.strip() == "defaultConfig {" and not inserted:
                  result.extend(insert_lines)
                  inserted = True

          if not inserted:
              raise RuntimeError("defaultConfig block was not found in app/build.gradle")

          path.write_text("\n".join(result) + "\n")

          print("Supabase configuration added successfully.")
          PY

      - name: Verify Supabase configuration
        working-directory: project/AppWorld-Android-Java
        run: |
          echo "Checking Supabase BuildConfig..."
          grep -n 'SUPABASE_URL' app/build.gradle
          grep -n 'SUPABASE_ANON_KEY' app/build.gradle

      - name: Build Debug APK
        working-directory: project/AppWorld-Android-Java
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Supabase-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
