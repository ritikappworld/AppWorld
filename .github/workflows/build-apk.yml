
name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Update-1.2.1-Java-Improved.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build AppWorld 1.2.1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify source ZIP
        run: |
          ZIP_FILE="AppWorld-Update-1.2.1-Java-Improved.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: AppWorld source ZIP not found!"
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract AppWorld project
        run: |
          mkdir -p extracted
          unzip -q AppWorld-Update-1.2.1-Java-Improved.zip -d extracted

          PROJECT_DIR="extracted/AppWorld-Android-Java"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle missing!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.10.2
        run: |
          cd "$RUNNER_TEMP"

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip

          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build AppWorld Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload AppWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-1.2.1-APK
          path: extracted/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
