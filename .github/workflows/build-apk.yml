name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AppWorld project
        run: |
          mkdir project
          unzip -q AppWorld-MobileStudio-FIXED.zip -d project

            - name: Connect Supabase
        working-directory: project/AppWorld-Android-Java
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import json

          p = Path("app/build.gradle")
          lines = p.read_text().splitlines()

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          new_lines = []

          for line in lines:
              if 'buildConfigField "String", "SUPABASE_URL"' in line:
                  continue
              if 'buildConfigField "String", "SUPABASE_ANON_KEY"' in line:
                  continue
              new_lines.append(line)

          insert = [
              '        buildConfigField "String", "SUPABASE_URL", ' + json.dumps(url),
              '        buildConfigField "String", "SUPABASE_ANON_KEY", ' + json.dumps(key)
          ]

          for i, line in enumerate(new_lines):
              if line.strip() == "defaultConfig {":
                  new_lines[i + 1:i + 1] = insert
                  break

          p.write_text("\n".join(new_lines) + "\n")
          print("Supabase BuildConfig fixed successfully.")
          PY

      - name: Build Debug APK
        working-directory: project/AppWorld-Android-Java
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Supabase-APK
          path: project/AppWorld-Android-Java/app/build/outputs/apk/debug/app-debug.apk
