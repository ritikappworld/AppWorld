name: Build AppWorld Update 1.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Update-1.2-Java.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: appworld-update-1-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract AppWorld ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AppWorld-Update-1.2-Java.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Upload the ZIP to the repository root using this exact filename."
            exit 1
          fi
          unzip -t "$ZIP_FILE"
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          PROJECT_DIR="extracted-project/AppWorld-Android-Java"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" || ! -f "$PROJECT_DIR/build.gradle" || ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: ZIP does not contain the expected AppWorld-Android-Java Gradle project."
            find extracted-project -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          GRADLE_ARGS=(--no-daemon --stacktrace)
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=$SUPABASE_URL")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          gradle "${GRADLE_ARGS[@]}" clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-Update-1.2-Debug-APK
          path: extracted-project/AppWorld-Android-Java/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
