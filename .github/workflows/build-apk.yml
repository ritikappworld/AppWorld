name: Build AppWorld APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AppWorld-Ritik-White-Profile-v1.1.zip'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-appworld-v1.1.yml'

permissions:
  contents: read

concurrency:
  group: appworld-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP and Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ZIP_FILE="AppWorld-Ritik-White-Profile-v1.1.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Upload the ZIP to the main repository page (not inside another folder)."
            exit 1
          fi

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "ERROR: GitHub Actions secret SUPABASE_URL is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "ERROR: GitHub Actions secret SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "ERROR: SUPABASE_URL must look like https://YOUR-PROJECT-REF.supabase.co"
            exit 1
          fi

          if [[ "$SUPABASE_ANON_KEY" == *service_role* || "$SUPABASE_ANON_KEY" == sb_secret_* ]]; then
            echo "ERROR: Do not use a service_role or sb_secret key in an Android app. Use the publishable/anon key."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf appworld-extracted
          mkdir -p appworld-extracted
          unzip -q "AppWorld-Ritik-White-Profile-v1.1.zip" -d appworld-extracted

          SETTINGS_FILE="$(find appworld-extracted -type f -name settings.gradle -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: app/build.gradle was not found beside settings.gradle."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project located at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.project_dir }}" \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-v1.1-debug-apk
          path: appworld-extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
