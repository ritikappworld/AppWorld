name: Build AppWorld 2.0.2 APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: appworld-2-0-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate AppWorld project
        id: locate
        shell: bash
        run: |
          if [[ -f "app/build.gradle" && -f "settings.gradle" ]]; then
            PROJECT_DIR="."
          elif [[ -f "AppWorld-Android-Java/app/build.gradle" && -f "AppWorld-Android-Java/settings.gradle" ]]; then
            PROJECT_DIR="AppWorld-Android-Java"
          else
            echo "ERROR: AppWorld Gradle project was not found. Extract the ZIP contents into the repository, or keep the AppWorld-Android-Java folder at repository root."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi
          echo "dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Using AppWorld project directory: ${PROJECT_DIR}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build AppWorld debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          GRADLE_ARGS=()
          if [[ -n "${SUPABASE_URL:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_URL=${SUPABASE_URL}")
          fi
          if [[ -n "${SUPABASE_ANON_KEY:-}" ]]; then
            GRADLE_ARGS+=("-PSUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}")
          fi
          gradle --no-daemon --stacktrace clean assembleDebug "${GRADLE_ARGS[@]}"

      - name: Verify APK was generated
        shell: bash
        run: |
          APK_PATH="${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "ERROR: APK was not generated at: $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload AppWorld 2.0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AppWorld-2.0.2-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
